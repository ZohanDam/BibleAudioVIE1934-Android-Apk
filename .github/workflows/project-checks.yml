name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check layout and documentation
        shell: pwsh
        run: ./tools/check_project.ps1
      - name: Test release tools without network
        shell: pwsh
        run: ./tools/test_release_tools.ps1
